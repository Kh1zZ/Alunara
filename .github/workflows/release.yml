name: Release Alunara (Android TV)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi rilis tanpa awalan 'v' (contoh: 0.1.0)"
        required: true
        default: "0.1.0"
      publish_release:
        description: "Publikasikan ke GitHub Releases resmi"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Split APKs (armv7a & armv8a) & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version metadata & changelog section
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
            PUBLISH_GH_RELEASE="true"
          else
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            RAW_TAG="v${VERSION_NAME}"
            PUBLISH_GH_RELEASE="${{ github.event.inputs.publish_release }}"
          fi

          VERSION_CODE="$(python3 - "$VERSION_NAME" <<'PY'
          import sys
          ver = sys.argv[1].split('-', 1)[0]
          parts = ver.split('.')
          major = int(parts[0]) if len(parts) > 0 and parts[0].isdigit() else 0
          minor = int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else 0
          patch = int(parts[2]) if len(parts) > 2 and parts[2].isdigit() else 0
          print(max(1, major * 10000 + minor * 100 + patch))
          PY
          )"

          mkdir -p dist
          python3 - "$VERSION_NAME" <<'PY' > dist/release-notes.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.M | re.S)
          match = pattern.search(changelog)
          if not match:
              sys.stderr.write(f"ERROR: Section ## [{version}] not found in CHANGELOG.md\n")
              sys.exit(1)
          notes = match.group(1).strip()
          footer = (
              "\n\n---\n"
              "### Official APK Downloads (Android TV 9+ / API 28+)\n"
              f"- **32-bit (`armeabi-v7a`, typical TVs with 1 GB of RAM):** `alunara-{version}.armv7a.apk`\n"
              f"- **64-bit (`arm64-v8a`, modern 64-bit Android TVs):** `alunara-{version}.armv8a.apk`\n\n"
              "### Credits & License (GNU GPL v3.0)\n"
              "Alunara integrates [ArchiveTune Core](https://github.com/rukamori/core) and "
              "[ArchiveTune Lyrics](https://github.com/rukamori/lyrics) by [rukamori](https://github.com/rukamori), "
              "as well as [Kuromoji](https://github.com/atilika/kuromoji)."
          )
          sys.stdout.write(f"## Alunara v{version}\n\n{notes}{footer}\n")
          PY

          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_GH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Unit Tests & Android Lint
        run: ./gradlew :core:domain:test :core:music:test :core:lyrics:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Prepare Android release signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALUNARA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALUNARA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALUNARA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALUNARA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KS_FILE="$RUNNER_TEMP/alunara-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
            echo "ALUNARA_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "ALUNARA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=Production Keystore (GitHub Secrets)" >> "$GITHUB_OUTPUT"
          else
            KS_FILE="$RUNNER_TEMP/alunara-ephemeral.jks"
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$EPHEMERAL_PASS"
            keytool -genkeypair \
              -keystore "$KS_FILE" \
              -alias alunara-ci \
              -keyalg RSA \
              -keysize 4096 \
              -validity 365 \
              -storetype JKS \
              -dname "CN=Alunara Release CI, OU=Release, O=Alunara, C=ID" \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS"
            echo "ALUNARA_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "ALUNARA_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_ALIAS=alunara-ci" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=Ephemeral CI Keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed R8 Split Release APKs (armeabi-v7a & arm64-v8a)
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon

      - name: Verify signatures & rename split APKs
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          APK_32="app/build/outputs/apk/release/app-armeabi-v7a-release.apk"
          APK_64="app/build/outputs/apk/release/app-arm64-v8a-release.apk"

          test -f "$APK_32"
          test -f "$APK_64"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK_32"
            "$APKSIGNER" verify --verbose --print-certs "$APK_64"
          fi

          mkdir -p dist
          cp "$APK_32" "dist/alunara-${VERSION_NAME}.armv7a.apk"
          cp "$APK_64" "dist/alunara-${VERSION_NAME}.armv8a.apk"
          ls -lh "dist/alunara-${VERSION_NAME}.armv7a.apk" "dist/alunara-${VERSION_NAME}.armv8a.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alunara-${{ steps.version.outputs.version_name }}-apks
          retention-days: 30
          path: |
            dist/alunara-*.apk
            dist/release-notes.md

      - name: Publish Official GitHub Release
        if: steps.version.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_tag }}
          name: Alunara ${{ steps.version.outputs.version_name }}
          prerelease: false
          generate_release_notes: false
          body_path: dist/release-notes.md
          files: |
            dist/alunara-${{ steps.version.outputs.version_name }}.armv7a.apk
            dist/alunara-${{ steps.version.outputs.version_name }}.armv8a.apk
