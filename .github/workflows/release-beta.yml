name: Release Beta (Android TV)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name (tanpa awalan 'v', contoh: 0.1.0-beta.1)"
        required: true
        default: "0.1.0-beta.1"
      publish_release:
        description: "Publikasikan ke GitHub Releases sebagai Pre-Release"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release-beta:
    name: Sign, Optimize (R8) & Publish Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
            PUBLISH_GH_RELEASE="true"
          else
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            RAW_TAG="v${VERSION_NAME}"
            PUBLISH_GH_RELEASE="${{ github.event.inputs.publish_release }}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_GH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Unit Tests & Android Lint
        run: ./gradlew :core:domain:test :core:music:test :core:lyrics:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Prepare Android release signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALUNARA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALUNARA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALUNARA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALUNARA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KS_FILE="$RUNNER_TEMP/alunara-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
            echo "ALUNARA_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "ALUNARA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=Production Keystore (GitHub Secrets)" >> "$GITHUB_OUTPUT"
          else
            KS_FILE="$RUNNER_TEMP/alunara-ephemeral.jks"
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$EPHEMERAL_PASS"
            keytool -genkeypair \
              -keystore "$KS_FILE" \
              -alias alunara-ci-beta \
              -keyalg RSA \
              -keysize 4096 \
              -validity 365 \
              -storetype JKS \
              -dname "CN=Alunara Beta CI, OU=Release, O=Alunara, C=ID" \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS"
            echo "ALUNARA_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "ALUNARA_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_ALIAS=alunara-ci-beta" >> "$GITHUB_ENV"
            echo "ALUNARA_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=Ephemeral CI Keystore (Set ALUNARA_KEYSTORE_* Secrets for persistent upgrades)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed R8 Release & Debug APKs
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --no-daemon

      - name: Verify Release APK signature & package artifacts
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          fi

          mkdir -p dist
          cp "$RELEASE_APK" "dist/Alunara-${VERSION_NAME}-android-tv-release.apk"
          cp "$DEBUG_APK" "dist/Alunara-${VERSION_NAME}-android-tv-debug.apk"
          if [ -f "$MAPPING_FILE" ]; then
            cp "$MAPPING_FILE" "dist/Alunara-${VERSION_NAME}-r8-mapping.txt"
          fi

          (cd dist && sha256sum Alunara-${VERSION_NAME}-android-tv-*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Beta Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alunara-${{ steps.version.outputs.version_name }}-artifacts
          retention-days: 30
          path: dist/

      - name: Publish GitHub Pre-Release
        if: steps.version.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_tag }}
          name: Alunara ${{ steps.version.outputs.version_name }} (Android TV Beta)
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Alunara-${{ steps.version.outputs.version_name }}-android-tv-release.apk
            dist/SHA256SUMS.txt
          body: |
            ## Alunara ${{ steps.version.outputs.version_name }} (Android TV 9+ / API 28+)

            - **Build mode:** R8 Minified + Resource Shrunk (`armeabi-v7a` & `arm64-v8a`)
            - **Signing mode:** ${{ steps.keystore.outputs.signing_mode }}
            - **Target hardware:** Android TV RAM 1 GB (reference: Changhong TV)

            ### Instalasi via ADB
            ```bash
            adb connect <IP_TV>:5555
            adb install -r Alunara-${{ steps.version.outputs.version_name }}-android-tv-release.apk
            ```

            ### Kredit & Lisensi (GPL-3.0)
            Alunara dibangun secara independen dengan integrasi base engine [ArchiveTune Core](https://github.com/rukamori/core) dan [ArchiveTune Lyrics](https://github.com/rukamori/lyrics) oleh [rukamori](https://github.com/rukamori), serta [Kuromoji](https://github.com/atilika/kuromoji) untuk romanisasi bahasa Jepang. Source code lengkap tersedia sesuai ketentuan GNU GPL v3.0 (`LICENSE` & `CREDITS.md`).
