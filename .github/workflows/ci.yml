name: Alunara CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, Lint & Build (Debug + R8 Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security & vendored base engine integrity check
        run: |
          if git ls-files | grep -E '\.(jks|keystore)$|^keystore\.properties$|^secrets\.properties$'; then
            echo "ERROR: Signing keystore or secret properties file must not be tracked in Git!"
            exit 1
          fi
          test -d third_party/core
          test -d third_party/lyrics/lrclib
          test -d third_party/lyrics/simpmusic
          test -d third_party/lyrics/kugou

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run all module unit tests
        run: ./gradlew :core:domain:test :core:music:test :core:lyrics:test :core:data:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug & R8-Minified Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Summarize APK sizes
        run: |
          shopt -s nullglob
          DEBUG_APKS=(app/build/outputs/apk/debug/*.apk)
          RELEASE_APKS=(app/build/outputs/apk/release/*.apk)
          ls -lh "${DEBUG_APKS[@]}" "${RELEASE_APKS[@]}"
          {
            echo "### Alunara Build Summary"
            for apk in "${DEBUG_APKS[@]}"; do
              echo "- Debug (\`$(basename "$apk")\`): \`$(stat -c%s "$apk")\` bytes"
            done
            for apk in "${RELEASE_APKS[@]}"; do
              echo "- Release R8 (\`$(basename "$apk")\`): \`$(stat -c%s "$apk")\` bytes"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports & build APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alunara-ci-artifacts-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-debug.html
            **/build/reports/tests/
